name: "Pro PR Reviewer"
branding:
  icon: "zoom-in"
  color: "black"
description: "Uses Azure OpenAI to review diffs, then posts code review comments on GitHub PRs."
author: "Propstreet"
runs:
  using: "node20"
  main: "dist/index.js" # compiled output

inputs:
  azureOpenAIEndpoint:
    description: "Azure OpenAI endpoint (e.g., https://your-resource.openai.azure.com/openai/deployments/...)"
    required: true
  azureOpenAIDeployment:
    description: "Azure OpenAI deployment (e.g., your-resource)"
    required: true
  azureOpenAIKey:
    description: "API key for Azure OpenAI"
    required: true
  base:
    description: "Base commit SHA to compare against."
    required: false
  head:
    description: "Head commit SHA to compare against."
    required: false
  severity:
    description: "Minimum severity level required to post a request changes review comment (info, warning, or error)."
    required: false
    default: "error"
  reasoningEffort:
    description: "Reasoning effort level (minimal, low, medium, high, or xhigh). GPT-5 supports 'minimal' for faster responses, GPT-5.2 supports 'xhigh' for maximum reasoning depth. For review purposes 'high' is recommended."
    required: false
    default: "medium"
  tokenLimit:
    description: "Maximum number of tokens to process."
    required: false
    default: "50000"
  commitLimit:
    description: "Maximum number of commits to load for 'entire-pr' diff mode."
    required: false
    default: "100"
  exclude:
    description: "Glob patterns to exclude files from review (e.g. '*.test.ts' or 'dist/**/*')"
    required: false
    default: ""
  customPrompt:
    description: "Custom instructions appended to the system prompt for the LLM reviewer (max 1000 chars). Example: 'Focus on security issues and best practices'"
    required: false
    default: ""
  backgroundMode:
    description: "Enable background mode for long-running requests (recommended for GPT-5-Pro). Options: 'enabled', 'disabled'."
    required: false
    default: "disabled"
  backgroundMaxWait:
    description: "Maximum wait time in minutes for background requests (1-60)."
    required: false
    default: "30"
  backgroundPollInterval:
    description: "Initial polling interval in seconds for background requests (5-60)."
    required: false
    default: "10"
  skipMergeCommits:
    description: "Skip merge commits during review. Merge commit diffs may not align with GitHub's PR diff, causing comment placement errors. Set to 'false' to review merge commits (may have partial success)."
    required: false
    default: "true"
